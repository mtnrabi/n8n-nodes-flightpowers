name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC). No npm token is used here:
  # npmjs.com has a trusted publisher for n8n-nodes-flightpowers set to
  # repository n8n-nodes-flightpowers, workflow publish.yml, no environment.
  # Renaming this file or adding an environment breaks that match (ENEEDAUTH).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: n8n-workflow pulls in isolated-vm, which declares
          # engines.node >= 22 and fails to compile under node-gyp on 20.
          # Trusted publishing also needs Node >= 22.14.0 (checked below).
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Check Node and npm versions
        run: |
          node -e '
            const [nm, nn] = process.versions.node.split(".").map(Number);
            if (nm < 22 || (nm === 22 && nn < 14)) {
              console.error(`::error::Node ${process.versions.node} < 22.14.0, trusted publishing needs 22.14.0+`);
              process.exit(1);
            }'
          NPM_V=$(npm --version)
          echo "node $(node --version), npm $NPM_V"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`::error::npm ${process.argv[1]} < 11.5.1, trusted publishing needs 11.5.1+`);
              process.exit(1);
            }' "$NPM_V"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Attribution is a header value: a wrong one fails no build and breaks no
      # search, it just files every call from this node under a name nobody is
      # looking at. That is how it stayed absent for three releases, so it is
      # checked here rather than left to review.
      - name: Check attribution
        run: node scripts/check-attribution.mjs

      # Auth is the OIDC exchange with npmjs.com (trusted publisher), no token.
      # prepublishOnly still runs build + lint + check-attribution + check-required.
      - name: Publish
        run: npm publish --provenance --access public
