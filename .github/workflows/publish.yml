name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance / trusted publishing. No npm token is stored
  # in this repository - register this workflow as a Trusted Publisher in the
  # npm package settings instead.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: n8n-workflow pulls in isolated-vm, which declares
          # engines.node >= 22 and fails to compile under node-gyp on 20.
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Attribution is a header value: a wrong one fails no build and breaks no
      # search, it just files every call from this node under a name nobody is
      # looking at. That is how it stayed absent for three releases, so it is
      # checked here rather than left to review.
      - name: Check attribution
        run: node scripts/check-attribution.mjs

      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Provenance needs `id-token: write` above AND an auth token here.
          # Swap this for npm Trusted Publishing when you have a moment -- it
          # removes the stored token entirely.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
