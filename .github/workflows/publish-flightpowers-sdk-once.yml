name: Publish flightpowers SDK (one-off)

# ONE-OFF. Delete this file after the first publish of the npm package
# "flightpowers" (repo mtnrabi/flightpowers-sdk), once npm Trusted Publishing
# is set up on that new package. It lives here only because this repo holds
# the one npm credential we have (secret NPM_TOKEN); the SDK repo has none.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of mtnrabi/flightpowers-sdk to publish, e.g. v0.1.0"
        required: true
        type: string
      dry_run:
        description: "true = npm publish --dry-run only (nothing published)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-flightpowers-sdk-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check tag format
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag must look like v0.1.0, got: $TAG"
            exit 1
          fi

      # Public repo: no token needed for the checkout.
      - uses: actions/checkout@v4
        with:
          repository: mtnrabi/flightpowers-sdk
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check package name and version
        working-directory: js
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          WANT="${TAG#v}"
          echo "package.json: $NAME@$VERSION, tag: $TAG"
          if [ "$NAME" != "flightpowers" ]; then
            echo "::error::package.json name is '$NAME', expected 'flightpowers'"
            exit 1
          fi
          if [ "$VERSION" != "$WANT" ]; then
            echo "::error::package.json version is '$VERSION', tag says '$WANT'"
            exit 1
          fi

      - name: Install
        working-directory: js
        run: npm ci

      - name: Build
        working-directory: js
        run: npm run build

      - name: Test
        working-directory: js
        run: npm test

      # Informational only: shows which npm account the token belongs to.
      # It cannot prove the token may publish a NEW package name.
      - name: Token check (npm whoami)
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami || echo "::warning::npm whoami failed, NPM_TOKEN may be missing, expired or too narrow"

      # No --provenance: package.json repository.url points at the SDK repo, and
      # provenance from this repo's workflow would not match it and would fail.
      - name: Publish
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="--access public --dry-run"
          else
            ARGS="--access public"
          fi
          set +e
          npm publish $ARGS 2>&1 | tee publish.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            if grep -Eq 'E403|E404|403 Forbidden|404 Not Found' publish.log; then
              echo "::error::npm answered 403/404: NPM_TOKEN is most likely a granular token limited to n8n-nodes-flightpowers and cannot publish 'flightpowers'. Use a token allowed to create new packages (or publish once by hand), then set up Trusted Publishing."
            else
              echo "::error::npm publish failed (exit $RC), see the log above"
            fi
            exit "$RC"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run passed: nothing was published."
          else
            echo "Published flightpowers@${TAG#v}: https://www.npmjs.com/package/flightpowers"
          fi
